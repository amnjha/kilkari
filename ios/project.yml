name: Kilkari
options:
  bundleIdPrefix: com.kilkari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated rather than committed: an .xcodeproj is a merge-conflict machine, and everything
# it would carry is here in fifty readable lines instead.
#
#   brew install xcodegen && cd ios && xcodegen generate

packages:
  KilkariCore:
    path: KilkariCore

targets:
  Kilkari:
    type: application
    platform: iOS
    sources:
      - path: Kilkari
    dependencies:
      - package: KilkariCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kilkari
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        # Portrait only, like the Android app: this is used one-handed at 4am, and a rotating
        # layout is one more thing to get wrong for no one's benefit.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Kilkari uses the camera to take your baby's photo and to scan documents. Nothing leaves the phone.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Kilkari can use a photo you already have as your baby's picture. Nothing leaves the phone.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
    preBuildScripts:
      - name: Sync shared data
        script: "\"${PROJECT_DIR}/tools/sync-common.sh\""
        basedOnDependencyAnalysis: false
