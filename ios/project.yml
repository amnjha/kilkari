name: Kilkari
options:
  bundleIdPrefix: com.kilkari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated rather than committed: an .xcodeproj is a merge-conflict machine, and everything
# it would carry is here in fifty readable lines instead.
#
#   brew install xcodegen && cd ios && xcodegen generate

packages:
  KilkariCore:
    path: KilkariCore

targets:
  Kilkari:
    type: application
    platform: iOS
    sources:
      - path: Kilkari
      # The faces themselves live in common/fonts so both platforms use the same files.
      # Referenced rather than copied, so there is one set in the repo.
      - path: ../common/fonts
        name: Fonts
        includes: ["*.ttf"]
    dependencies:
      - package: KilkariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kilkari
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Portrait only, like the Android app: this is used one-handed at 4am, and a rotating
        # layout is one more thing to get wrong for no one's benefit.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
    info:
      path: Kilkari/Info.plist
      properties:
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Kilkari uses the camera to take your baby's photo and to scan documents. Nothing leaves the phone.
        NSPhotoLibraryUsageDescription: Kilkari can use a photo you already have as your baby's picture. Nothing leaves the phone.
        UIAppFonts:
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
    preBuildScripts:
      - name: Sync shared data
        script: "\"${PROJECT_DIR}/tools/sync-common.sh\""
        basedOnDependencyAnalysis: false
