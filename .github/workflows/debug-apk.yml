# Builds the debug-signed APK. The Android SDK only ships from dl.google.com, which the
# agent sandbox cannot reach, so the APK is built on a runner that already has it.
name: Debug APK

on:
  push:
    branches:
      - claude/backdated-action-entries-5fnt15
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report the APK
        run: |
          ls -l app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "META-INF/(CERT|.*\.RSA)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: kilkari-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
